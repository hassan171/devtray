name: debug_overlay_riverpod
description: "Riverpod adapter for debug_overlay — feeds the overlay's State page from providers."
version: 0.1.0

publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  debug_overlay:
    version: ^0.1.0
    path: ../debug_overlay
  flutter_riverpod: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # DEV-only, for one test: that bloc and Riverpod can feed the same page at
  # once. Neither the core nor debug_overlay_bloc can prove that (the core has
  # no state library; _bloc has no riverpod), so it's proven here. Nothing in
  # lib/ touches these.
  bloc: ^9.0.0
  debug_overlay_bloc:
    path: ../debug_overlay_bloc
