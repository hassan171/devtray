name: debug_overlay
description: "A draggable in-app debugging overlay with a pluggable page system and a built-in network inspector (dio + http adapters)."
version: 0.1.0
homepage:

environment:
  sdk: ">=3.12.0 <4.0.0"

# Resolved as part of the workspace at the repo root — one shared lockfile, one
# `pub get` for every package here.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  http: ^1.2.0
  flutter_html: ^3.0.0
  device_info_plus: ">=11.0.0 <13.0.0"
  package_info_plus: ">=8.0.0 <10.0.0"
  shared_preferences: ^2.3.0
  bloc: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Bundled so the overlay's data columns render identically on every platform,
  # with no setup in the host app. Debug tooling only ships in debug builds, so
  # the ~800KB never reaches a release binary.
  #
  # JetBrains Mono is SIL Open Font License 1.1 — assets/fonts/JetBrainsMono-OFL.txt
  # ships alongside the font, as the licence requires.
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
