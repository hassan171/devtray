name: debug_overlay_hive
description: "Hive support for debug_overlay's Storage page — register a box as you open it, and browse or edit it at runtime."
version: 0.1.0

# Not published yet — the core isn't on pub.dev either, so the `path` dependency
# below is the only way these resolve. Drop this (and set `homepage`) when the
# set is ready to publish together; the `version` constraint is already in place
# for that day.
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  debug_overlay:
    version: ^0.1.0
    path: ../debug_overlay
  hive_ce: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
