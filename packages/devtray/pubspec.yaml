name: devtray
description: "A draggable in-app debugging overlay for Flutter: network, logs, state, storage and device inspection in a tabbed panel over your running app. Zero dependencies."
version: 0.1.0
repository: https://github.com/hassan171/devtray/tree/main/packages/devtray
issue_tracker: https://github.com/hassan171/devtray/issues

environment:
  sdk: ">=3.12.0 <4.0.0"

# Resolved as part of the workspace at the repo root — one shared lockfile, one
# `pub get` for every package here.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Bundled so the overlay's data columns render identically on every platform,
  # with no setup in the host app. Debug tooling only ships in debug builds, so
  # the ~800KB never reaches a release binary.
  #
  # JetBrains Mono is SIL Open Font License 1.1 — assets/fonts/JetBrainsMono-OFL.txt
  # ships alongside the font, as the licence requires.
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
