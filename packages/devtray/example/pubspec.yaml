name: devtray_example
description: "A minimal devtray example — the overlay and four core pages, with no integration packages."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.12.0 <4.0.0"

# Not a workspace member: this ships *inside* the published devtray archive, so
# it has to resolve against the hosted package the same way a user's app does.
# The repo-root `example/` is the workspace one, wired to every integration.
dependencies:
  flutter:
    sdk: flutter
  # Intentionally one version behind the package that ships it: `^0.6.2` already
  # allows 0.6.3, and pinning `^0.6.3` here would make this example unresolvable
  # until the moment it's published — breaking `flutter analyze` and CI in the
  # window between the version bump and the upload.
  devtray: ^0.6.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
