name: debug_overlay_http
description: "package:http adapter for debug_overlay — feeds the overlay's network inspector from an http Client."
version: 0.1.0

# Not published yet — the core isn't on pub.dev either, so the `path` dependency
# below is the only way these resolve. Drop this (and set `homepage`) when the
# set is ready to publish together; the `version` constraint is already in place
# for that day.
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Both `version` and `path`: pub uses the path while developing in this
  # workspace, and the version constraint once published. Without the version a
  # publishable package can't have a path dependency at all.
  debug_overlay:
    version: ^0.1.0
    path: ../debug_overlay
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
