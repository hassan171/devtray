name: debug_overlay_sqflite
description: "SQLite support for debug_overlay's Storage page — hand it a Database and every table shows up, discovered from the schema."
version: 0.1.0

# Not published yet — the core isn't on pub.dev either, so the `path` dependency
# below is the only way these resolve. Drop this (and set `homepage`) when the
# set is ready to publish together; the `version` constraint is already in place
# for that day.
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  debug_overlay:
    version: ^0.1.0
    path: ../debug_overlay
  sqflite: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # A DEV dependency, deliberately. sqflite ships native implementations for
  # Android/iOS/macOS only; the FFI package supplies Windows and Linux. The tests
  # need it (they run on the desktop), but a consumer shouldn't be made to carry
  # the desktop FFI stack — an app targeting phones never needs it. Apps that DO
  # target desktop add it themselves; see the example.
  sqflite_common_ffi: ^2.3.3
