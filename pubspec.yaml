name: devtray_workspace
description: "Workspace root for devtray and its integration packages. Not published."
publish_to: "none"
version: 0.0.0

environment:
  # Pub workspaces need 3.6+. They give every member one shared lockfile and one
  # `pub get`, which is the whole reason this repo doesn't need melos.
  sdk: ^3.12.2

# The core plus one package per integration. The core carries no runtime
# dependencies; each integration package owns exactly one — so an app that uses
# `http` and Riverpod never compiles dio or bloc.
#
# See the README for what moved where.
workspace:
  - packages/devtray
  - packages/devtray_dio
  - packages/devtray_http
  - packages/devtray_bloc
  - packages/devtray_riverpod
  - packages/devtray_prefs
  - packages/devtray_device
  - packages/devtray_html
  - packages/devtray_hive
  - packages/devtray_sqflite
  - example

dev_dependencies:
  flutter_lints: ^6.0.0

