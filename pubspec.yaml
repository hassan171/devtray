name: debug_overlay_workspace
description: "Workspace root for debug_overlay and its integration packages. Not published."
publish_to: "none"
version: 0.0.0

environment:
  # Pub workspaces need 3.6+. They give every member one shared lockfile and one
  # `pub get`, which is the whole reason this repo doesn't need melos.
  sdk: ^3.12.2

# The core plus one package per integration. The core carries no runtime
# dependencies; each integration package owns exactly one — so an app that uses
# `http` and Riverpod never compiles dio or bloc.
#
# See MIGRATION_PLAN.md for why, and for what moved where.
workspace:
  - packages/debug_overlay
  - packages/debug_overlay_dio
  - packages/debug_overlay_http
  - packages/debug_overlay_bloc
  - packages/debug_overlay_prefs
  - packages/debug_overlay_device
  - packages/debug_overlay_html
  - packages/debug_overlay_hive
  - packages/debug_overlay_sqflite
  - example

dev_dependencies:
  flutter_lints: ^6.0.0
